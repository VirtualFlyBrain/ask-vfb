<!doctype html>
<html><head><meta charset="utf-8"><title>VFB scene</title>
<style>
:root{--bg:#070b16;--fg:#e8eefc;--dim:#93a0c0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:var(--fg)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#title{position:absolute;left:5%;top:6%;max-width:60%;opacity:0}
#title h1{margin:0;font-size:5.2vh;line-height:1.1;font-weight:700}
#title p{margin:1.2vh 0 0;font-size:2.6vh;color:var(--dim)}
#legend{position:absolute;left:5%;bottom:7%;display:flex;flex-direction:column;gap:1.2vh}
.row{display:flex;align-items:center;gap:1.2vh;font-size:2.7vh;opacity:0;white-space:nowrap}
.dot{width:2.2vh;height:2.2vh;border-radius:50%}
#footer{position:absolute;right:3%;bottom:3%;font-size:2vh;color:var(--dim);opacity:.85;text-align:right}
#refs{position:absolute;inset:0;background:rgba(7,11,22,.88);padding:8% 9%;opacity:0;display:flex;flex-direction:column;justify-content:center;gap:1.6vh}
#refs h2{margin:0 0 1vh;font-size:4.2vh}
#refs p{margin:0;font-size:2.4vh;line-height:1.45;color:var(--fg)}
#refs .small{font-size:2vh;color:var(--dim)}
</style></head><body>
<div id="title"><h1></h1><p></p></div>
<div id="legend"></div>
<div id="footer">virtualflybrain.org</div>
<div id="refs"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const spec = await (await fetch('spec.resolved.json')).json();
const W = spec.width||1920, H = spec.height||1080, DUR = spec.duration||30;
const TITLE_T = 3.0, END_T = spec.end_card_seconds||7;
const renderer = new THREE.WebGLRenderer({antialias:false, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
document.body.prepend(renderer.domElement);
document.body.style.width=W+'px'; document.body.style.height=H+'px';
renderer.domElement.style.width=W+'px'; renderer.domElement.style.height=H+'px';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070b16);
const cam = new THREE.PerspectiveCamera(35, W/H, 1, 20000); cam.up.set(0,-1,0);
const PAL=['#4c8dff','#35e7e0','#ffb347','#ff6b9d','#a46bff','#7bd88f','#ffd166','#ef476f'];

async function txt(u){const r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.text();}
function parseSWC(t){const pts=new Map(), segs=[];
  for(const l of t.split('\n')){ if(!l||l[0]==='#') continue; const a=l.trim().split(/\s+/);
    if(a.length<7) continue; pts.set(+a[0],[+a[2],+a[3],+a[4]]); }
  for(const l of t.split('\n')){ if(!l||l[0]==='#') continue; const a=l.trim().split(/\s+/);
    if(a.length<7) continue; const p=+a[6]; if(p>0&&pts.has(p)){const c=pts.get(+a[0]),q=pts.get(p); segs.push(c[0],c[1],c[2],q[0],q[1],q[2]);}}
  return new Float32Array(segs);}
function parseOBJ(t){const v=[],idx=[];
  for(const l of t.split('\n')){ if(l[0]==='v'&&l[1]===' '){const a=l.trim().split(/\s+/);v.push(+a[1],+a[2],+a[3]);}
    else if(l[0]==='f'){const a=l.trim().split(/\s+/).slice(1).map(s=>parseInt(s)-1); for(let i=1;i<a.length-1;i++)idx.push(a[0],a[i],a[i+1]);}}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); if(idx.length) g.setIndex(idx); g.userData.faces=idx.length>0; return g;}

const items=[]; const box=new THREE.Box3();
if(spec.template && spec.template.obj_local){
  const g=parseOBJ(await txt(spec.template.obj_local));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x6f86c8,transparent:true,opacity:.05,depthWrite:false,side:THREE.DoubleSide}));
  scene.add(m); spec.template._mesh=m; if(!(spec.items||[]).length) box.expandByObject(m);
}
let k=0;
for(const it of spec.items||[]){
  const color=new THREE.Color(it.color||PAL[k%PAL.length]); k++;
  let obj, n=0;
  if(it.swc_local){const s=parseSWC(await txt(it.swc_local)); const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(s,3)); n=s.length/3; obj=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color}));
  } else if(it.obj_local){const g=parseOBJ(await txt(it.obj_local));
    if(g.userData.faces){ g.computeVertexNormals(); n=g.index.count;
      obj=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:it.opacity??.35,depthWrite:false,side:THREE.DoubleSide}));
    } else { /* some VFB .obj files are face-less point clouds (v x y z intensity): draw as dots */
      n=g.getAttribute('position').count;
      obj=new THREE.Points(g,new THREE.PointsMaterial({color,size:it.point_size??1.6,sizeAttenuation:true,transparent:true,opacity:it.opacity??.9,depthWrite:false}));}}
  else continue;
  scene.add(obj); it._obj=obj; it._n=n; it._color='#'+color.getHexString(); items.push(it); box.expandByObject(obj);
}
const sph=new THREE.Sphere(); box.getBoundingSphere(sph);
const target=sph.center.clone(); const dist=sph.radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*(spec.zoom_out??1.5);

// timeline
const body=Math.max(1,DUR-TITLE_T-END_T), step=items.length?Math.min(2.5,body/(items.length+0.5)):0, draw=Math.min(2.5,step*1.6||2);
items.forEach((it,i)=>{it._t0=TITLE_T+i*step;});
const $=id=>document.getElementById(id);
$('title').querySelector('h1').textContent=spec.title||''; $('title').querySelector('p').textContent=spec.subtitle||'';
const leg=$('legend'); items.forEach(it=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="dot" style="background:${it._color}"></span><span></span>`;r.lastChild.textContent=it.label||it.id;it._row=r;leg.appendChild(r);});
$('refs').innerHTML='<h2>References and data sources</h2>'+(spec.end_card_lines||[]).map((l,i)=>`<p class="${i>2?'small':''}"></p>`).join('');
[...$('refs').querySelectorAll('p')].forEach((p,i)=>p.textContent=(spec.end_card_lines||[])[i]||'');
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
window.seek=t=>{
  const az=(spec.orbit_turns??0.6)*2*Math.PI*t/DUR+0.35;
  cam.position.set(target.x+dist*Math.sin(az), target.y-dist*0.08, target.z-dist*Math.cos(az)); cam.lookAt(target);
  for(const it of items){const p=ease((t-it._t0)/draw); const o=it._obj;
    if(o.isLineSegments||o.isPoints) o.geometry.setDrawRange(0,Math.floor(it._n*p)); else o.geometry.setDrawRange(0,Math.floor(it._n*p/3)*3);
    it._row.style.opacity=ease((t-it._t0)/0.6);}
  $('title').style.opacity = ease(t/0.8)*ease((TITLE_T+1.5-t)/1.0);
  const fin=ease((t-(DUR-END_T))/0.8)*ease((DUR-t)/0.6); $('refs').style.opacity=fin;
  renderer.render(scene,cam);
};
window.READY=true;
</script></body></html>
